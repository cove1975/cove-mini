<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cove Mini 2.0 — Smooth Motion</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(160deg, #e6f5ff, #a9d6f3);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  padding: 20px;
}

h1 {
  color: #244b68;
  margin-bottom: 65px;
}

.robot {
  position: relative;
  width: 240px;
  height: 310px;
  margin: auto;
}

/* MOVING HEAD */

.head-group {
  position: absolute;
  top: 28px;
  left: 20px;
  width: 200px;
  height: 175px;
  transform-origin: center bottom;
  animation: bob 2.6s ease-in-out infinite;
  z-index: 2;
}

.head {
  position: absolute;
  top: 30px;
  width: 200px;
  height: 145px;
  background: white;
  border-radius: 48%;
  box-shadow: 0 10px 25px #567a9950;
  z-index: 2;
}

/* INDEPENDENT ANTENNAS */

.antenna {
  position: absolute;
  width: 15px;
  height: 65px;
  background: white;
  border-radius: 15px;
  top: -20px;
  z-index: 1;
  transform-origin: center bottom;
}

.antenna.left {
  left: 35px;
  animation: wiggleLeft 2.1s ease-in-out infinite;
}

.antenna.right {
  right: 35px;
  animation: wiggleRight 2.7s ease-in-out infinite;
}

.antenna::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -5px;
  width: 25px;
  height: 25px;
  background: white;
  border-radius: 50%;
}

/* ANTENNA ANIMATIONS */

@keyframes wiggleLeft {
  0%, 100% {
    transform: rotate(-25deg);
  }
  25% {
    transform: rotate(-38deg);
  }
  50% {
    transform: rotate(-18deg);
  }
  75% {
    transform: rotate(-32deg);
  }
}

@keyframes wiggleRight {
  0%, 100% {
    transform: rotate(25deg);
  }
  25% {
    transform: rotate(15deg);
  }
  50% {
    transform: rotate(39deg);
  }
  75% {
    transform: rotate(20deg);
  }
}

/* EXPRESSIVE EYES */

.eye {
  position: absolute;
  background: #111;
  border-radius: 50%;
  top: 48px;
}

.eye.left {
  width: 48px;
  height: 55px;
  left: 38px;
}

.eye.right {
  width: 35px;
  height: 42px;
  right: 42px;
  top: 55px;
}

/* BODY */

.body {
  position: absolute;
  width: 155px;
  height: 135px;
  left: 42px;
  top: 165px;
  background: #fdfdfd;
  border-radius: 45% 45% 35% 35%;
  box-shadow: 0 12px 25px #567a9950;
}

/* HEAD BOBBING */

@keyframes bob {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }
  50% {
    transform: translateY(-14px) rotate(6deg);
  }
}

/*
  No talking animation overrides.
  JavaScript changes playback speed smoothly.
*/

/* BUTTON */

button {
  margin-top: 15px;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  background: #245d86;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #163e5b;
}

#status {
  color: #244b68;
  min-height: 25px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Meet Cove Mini!</h1>

  <div class="robot" id="robot">

    <div class="head-group">

      <div class="antenna left"></div>
      <div class="antenna right"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>

    </div>

    <div class="body"></div>

  </div>

  <button onclick="startCoveLiveVoice()">
    Talk to Cove Mini
  </button>

  <p id="status">
    Ready to say hello!
  </p>

</div>

<script>

/* ROBOT ELEMENTS */

const robot = document.getElementById("robot");

const status = document.getElementById("status");

const headGroup = document.querySelector(".head-group");

const leftAntenna =
  document.querySelector(".antenna.left");

const rightAntenna =
  document.querySelector(".antenna.right");


/* SMOOTH MOVEMENT CONTROL */

const motionParts = [
  {
    element: headGroup,
    animationName: "bob",
    talkRate: 2.6 / 1.0
  },
  {
    element: leftAntenna,
    animationName: "wiggleLeft",
    talkRate: 2.1 / 0.45
  },
  {
    element: rightAntenna,
    animationName: "wiggleRight",
    talkRate: 2.7 / 0.6
  }
];

const speedTransitions = new WeakMap();


/* FIND ANIMATION */

function getPartAnimation(part) {

  if (!part.element) return null;

  return part.element.getAnimations().find(
    animation =>
      animation.animationName === part.animationName
  ) || null;

}


/* SMOOTH SPEED TRANSITION */

function smoothlySetPlaybackRate(
  animation,
  targetRate,
  durationMs = 450
) {

  const previousFrame =
    speedTransitions.get(animation);

  if (previousFrame !== undefined) {
    cancelAnimationFrame(previousFrame);
  }

  const initialRate = animation.playbackRate;

  if (Math.abs(targetRate - initialRate) < 0.001) {
    speedTransitions.delete(animation);
    return;
  }

  let startedAt = null;

  function frame(now) {

    if (startedAt === null) {
      startedAt = now;
    }

    const fraction = Math.min(
      (now - startedAt) / durationMs,
      1
    );

    const eased =
      fraction * fraction * (3 - 2 * fraction);

    animation.playbackRate =
      initialRate +
      (targetRate - initialRate) * eased;

    if (fraction < 1) {

      speedTransitions.set(
        animation,
        requestAnimationFrame(frame)
      );

    } else {

      animation.playbackRate = targetRate;

      speedTransitions.delete(animation);

    }

  }

  speedTransitions.set(
    animation,
    requestAnimationFrame(frame)
  );

}


/* HEAD AND ANTENNA MOVEMENT */

function setCoveMotion(talking) {

  robot.classList.toggle("talking", talking);

  for (const part of motionParts) {

    const animation = getPartAnimation(part);

    if (animation) {

      smoothlySetPlaybackRate(
        animation,
        talking ? part.talkRate : 1
      );

    }

  }

}


/* BUILT-IN SPEECH DEMO */

function speak() {

  if (!("speechSynthesis" in window)) {

    status.textContent =
      "Speech is not supported in this browser.";

    return;

  }

  window.speechSynthesis.cancel();

  const message = new SpeechSynthesisUtterance(
    "Hello! I'm Cove Mini! " +
    "Look at my new antennas! " +
    "Now I can wiggle them independently! " +
    "What do you think?"
  );

  message.lang = "en-US";
  message.rate = 0.95;
  message.pitch = 1.15;

  message.onstart = function() {

    setCoveMotion(true);

    status.textContent =
      "Cove Mini is speaking!";

  };

  function finish() {

    setCoveMotion(false);

    status.textContent =
      "Ready to say hello!";

  }

  message.onend = finish;
  message.onerror = finish;

  window.speechSynthesis.speak(message);

}


/* MICROPHONE TEST */

const micButton = document.createElement("button");

micButton.textContent = "🎤 Test Microphone";

micButton.style.cssText =
  "padding:14px 24px; margin:20px; " +
  "border-radius:20px; font-size:18px; " +
  "cursor:pointer;";

document.body.appendChild(micButton);

micButton.addEventListener("click", async () => {

  try {

    micButton.textContent =
      "Connecting microphone...";

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    micButton.textContent =
      "✓ Microphone working!";

    stream.getTracks().forEach(
      track => track.stop()
    );

  } catch (error) {

    micButton.textContent =
      "Microphone unavailable";

    console.error(error);

  }

});


/* COVE MINI LIVE VOICE CONNECTION */

const COVE_WORKER_URL =
  "https://cove-mini-voice.ycrt22frsb.workers.dev/session";

let covePeerConnection = null;

let coveMicrophoneStream = null;


/* REQUEST TEMPORARY VOICE CREDENTIAL */

async function getCoveVoiceToken() {

  const accessToken = prompt(
    "Enter your private Cove Mini access token:"
  );

  if (!accessToken) {
    throw new Error("Connection cancelled.");
  }

  const response = await fetch(COVE_WORKER_URL, {

    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + accessToken.trim()
    },

    body: JSON.stringify({})

  });

  if (!response.ok) {

    throw new Error(
      "Voice connection failed: " + response.status
    );

  }

  const data = await response.json();

  const token =
    data.value || data.client_secret?.value;

  if (!token) {
    throw new Error("Voice credential missing.");
  }

  return token;

}


/* LIVE WEBRTC VOICE CONNECTION */

async function startCoveLiveVoice() {

  if (covePeerConnection) return;

  let pc;
  let mic;

  try {

    const token = await getCoveVoiceToken();

    pc = new RTCPeerConnection();

    covePeerConnection = pc;

    const audio = document.createElement("audio");

    audio.autoplay = true;
    audio.playsInline = true;

    pc.ontrack = (event) => {

      audio.srcObject = event.streams[0];

      audio.play().catch(console.error);

    };


    /* ACTIVATE MICROPHONE */

    mic = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    coveMicrophoneStream = mic;

    pc.addTrack(mic.getAudioTracks()[0], mic);


    /* OPEN COMMUNICATION CHANNEL */

    const channel =
      pc.createDataChannel("oai-events");

    channel.onmessage = (event) => {

      console.log("Cove Mini:", event.data);

      let data;

      try {

        data = JSON.parse(event.data);

      } catch (error) {

        console.warn("Unknown voice event:", error);
        return;

      }


      /* COVE MINI STARTS SPEAKING */

      if (data.type === "output_audio_buffer.started") {

        setCoveMotion(true);

        status.textContent =
          "Cove Mini is speaking!";

      }


      /* COVE MINI STOPS SPEAKING */

      if (data.type === "output_audio_buffer.stopped") {

        setCoveMotion(false);

        status.textContent =
          "Ready to say hello!";

      }

    };


    /* ESTABLISH REALTIME CONNECTION */

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    const response = await fetch(
      "https://api.openai.com/v1/realtime/calls",
      {

        method: "POST",

        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/sdp"
        },

        body: offer.sdp

      }
    );

    if (!response.ok) {

      throw new Error(
        "Realtime connection failed: " + response.status
      );

    }

    await pc.setRemoteDescription({

      type: "answer",

      sdp: await response.text()

    });

    console.log(
      "Cove Mini live voice connected!"
    );

  } catch (error) {

    console.error("Cove Mini error:", error);

    if (mic) {

      mic.getTracks().forEach(
        track => track.stop()
      );

    }

    if (pc) pc.close();

    coveMicrophoneStream = null;

    covePeerConnection = null;

    setCoveMotion(false);

    alert("Cove Mini: " + error.message);

  }

}

</script>

</body>
</html>
