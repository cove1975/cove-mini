<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cove Mini 3.0</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(160deg, #e6f5ff, #a9d6f3);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  padding: 20px;
}

h1 {
  color: #244b68;
  margin-bottom: 65px;
}

.robot {
  position: relative;
  width: 240px;
  height: 310px;
  margin: auto;
}

/* MOVING HEAD */

.head-group {
  position: absolute;
  top: 28px;
  left: 20px;
  width: 200px;
  height: 175px;
  transform-origin: center bottom;
  animation: bob 2.6s ease-in-out infinite;
  z-index: 2;
}

.head {
  position: absolute;
  top: 30px;
  width: 200px;
  height: 145px;
  background: white;
  border-radius: 48%;
  box-shadow: 0 10px 25px #567a9950;
  z-index: 2;
}

/* INDEPENDENT ANTENNAS */

.antenna {
  position: absolute;
  width: 15px;
  height: 65px;
  background: white;
  border-radius: 15px;
  top: -20px;
  z-index: 1;
  transform-origin: center bottom;
}

.antenna.left {
  left: 35px;
  animation: wiggleLeft 2.1s ease-in-out infinite;
}

.antenna.right {
  right: 35px;
  animation: wiggleRight 2.7s ease-in-out infinite;
}

.antenna::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -5px;
  width: 25px;
  height: 25px;
  background: white;
  border-radius: 50%;
}

@keyframes wiggleLeft {
  0%, 100% { transform: rotate(-25deg); }
  25% { transform: rotate(-38deg); }
  50% { transform: rotate(-18deg); }
  75% { transform: rotate(-32deg); }
}

@keyframes wiggleRight {
  0%, 100% { transform: rotate(25deg); }
  25% { transform: rotate(15deg); }
  50% { transform: rotate(39deg); }
  75% { transform: rotate(20deg); }
}

/* EXPRESSIVE EYES */

.eye {
  position: absolute;
  background: #111;
  border-radius: 50%;
  top: 48px;
}

.eye.left {
  width: 48px;
  height: 55px;
  left: 38px;
}

.eye.right {
  width: 35px;
  height: 42px;
  right: 42px;
  top: 55px;
}

/* BODY */

.body {
  position: absolute;
  width: 155px;
  height: 135px;
  left: 42px;
  top: 165px;
  background: #fdfdfd;
  border-radius: 45% 45% 35% 35%;
  box-shadow: 0 12px 25px #567a9950;
}

/* HEAD BOBBING */

@keyframes bob {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }

  50% {
    transform: translateY(-14px) rotate(6deg);
  }
}

/* START / STOP BUTTON */

button {
  margin-top: 15px;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  background: #245d86;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #163e5b;
}

#status {
  color: #244b68;
  min-height: 25px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Meet Cove Mini!</h1>

  <div class="robot" id="robot">
    <div class="head-group">
      <div class="antenna left"></div>
      <div class="antenna right"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
    </div>

    <div class="body"></div>
  </div>

  <button id="talkButton" type="button">
    Talk to Cove Mini
  </button>

  <p id="status" role="status" aria-live="polite">
    Ready to say hello!
  </p>
</div>

<script>
/* ELEMENTS AND CONNECTION SETTINGS */

const robot = document.getElementById("robot");
const status = document.getElementById("status");
const talkButton = document.getElementById("talkButton");

const COVE_WORKER_URL =
  "https://cove-mini-voice.ycrt22frsb.workers.dev/session";

const ACCESS_TOKEN_STORAGE_KEY =
  "coveMiniWorkerAccessToken";

/* SMOOTH HEAD AND ANTENNA MOVEMENTS */

// Each animation keeps running.
// Only its playback speed changes.

const motionParts = [
  {
    element: document.querySelector(".head-group"),
    name: "bob",
    talkRate: 2.6 / 1.0
  },
  {
    element: document.querySelector(".antenna.left"),
    name: "wiggleLeft",
    talkRate: 2.1 / 0.45
  },
  {
    element: document.querySelector(".antenna.right"),
    name: "wiggleRight",
    talkRate: 2.7 / 0.6
  }
];

const speedFrames = new WeakMap();

function setCoveMotion(talking) {
  robot.classList.toggle("talking", talking);

  for (const part of motionParts) {
    const animation = part.element.getAnimations().find(
      item => item.animationName === part.name
    );

    if (!animation) continue;

    const oldFrame = speedFrames.get(animation);

    if (oldFrame !== undefined) {
      cancelAnimationFrame(oldFrame);
    }

    const initial = animation.playbackRate;
    const target = talking ? part.talkRate : 1;

    if (Math.abs(initial - target) < 0.001) {
      speedFrames.delete(animation);
      continue;
    }

    let start = null;

    function tick(now) {
      if (start === null) {
        start = now;
      }

      const fraction = Math.min(
        (now - start) / 450,
        1
      );

      const smooth =
        fraction * fraction * (3 - 2 * fraction);

      animation.playbackRate =
        initial + (target - initial) * smooth;

      if (fraction < 1) {
        speedFrames.set(
          animation,
          requestAnimationFrame(tick)
        );
      } else {
        animation.playbackRate = target;
        speedFrames.delete(animation);
      }
    }

    speedFrames.set(
      animation,
      requestAnimationFrame(tick)
    );
  }
}

/* SESSION STATE */

let covePeerConnection = null;
let coveMicrophoneStream = null;
let coveAudio = null;
let connectionAbort = null;
let sessionVersion = 0;

// Possible states: idle, connecting, connected.
let connectionState = "idle";

function showConnectionState(state, message) {
  connectionState = state;

  talkButton.textContent =
    state === "connected"
      ? "Stop talking"
      : state === "connecting"
        ? "Cancel connection"
        : "Talk to Cove Mini";

  status.textContent = message;
}

/* REMEMBER THE COVE MINI ACCESS TOKEN */

function readSavedAccessToken() {
  try {
    return localStorage.getItem(
      ACCESS_TOKEN_STORAGE_KEY
    );
  } catch (_) {
    return null;
  }
}

function saveAccessToken(token) {
  try {
    localStorage.setItem(
      ACCESS_TOKEN_STORAGE_KEY,
      token
    );
  } catch (_) {
    // If storage is unavailable, ask again next time.
  }
}

function clearAccessToken() {
  try {
    localStorage.removeItem(
      ACCESS_TOKEN_STORAGE_KEY
    );
  } catch (_) {
    // Storage may be unavailable.
  }
}

/* REQUEST A TEMPORARY VOICE CREDENTIAL */

async function getCoveVoiceToken(signal) {
  let accessToken = readSavedAccessToken();

  if (!accessToken) {
    accessToken = prompt(
      "Enter your private Cove Mini access token:"
    );

    if (!accessToken || !accessToken.trim()) {
      throw new Error("Connection cancelled.");
    }

    accessToken = accessToken.trim();
  }

  const response = await fetch(COVE_WORKER_URL, {
    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + accessToken
    },

    body: JSON.stringify({}),
    signal
  });

  if (
    response.status === 401 ||
    response.status === 403
  ) {
    clearAccessToken();

    throw new Error(
      "Access token rejected. Press Talk to enter it again."
    );
  }

  if (!response.ok) {
    throw new Error(
      "Voice connection failed: " + response.status
    );
  }

  const data = await response.json();

  const temporaryToken =
    data.value || data.client_secret?.value;

  if (!temporaryToken) {
    throw new Error("Voice credential missing.");
  }

  // Save only after the Worker accepted the token.
  saveAccessToken(accessToken);

  return temporaryToken;
}

/* STOP THE CONVERSATION */

function stopCoveLiveVoice() {
  // Invalidate any connection attempt still in progress.
  ++sessionVersion;

  if (connectionAbort) {
    connectionAbort.abort();
  }

  connectionAbort = null;

  if (coveMicrophoneStream) {
    coveMicrophoneStream.getTracks().forEach(
      track => track.stop()
    );

    coveMicrophoneStream = null;
  }

  if (covePeerConnection) {
    covePeerConnection.close();
    covePeerConnection = null;
  }

  if (coveAudio) {
    coveAudio.pause();
    coveAudio.srcObject = null;
    coveAudio.remove();
    coveAudio = null;
  }

  setCoveMotion(false);

  showConnectionState(
    "idle",
    "Ready to say hello!"
  );
}

/* START THE CONVERSATION */

async function startCoveLiveVoice() {
  if (connectionState !== "idle") return;

  const version = ++sessionVersion;
  const controller = new AbortController();

  connectionAbort = controller;

  showConnectionState(
    "connecting",
    "Connecting Cove Mini..."
  );

  const ensureActive = () => {
    if (version !== sessionVersion) {
      throw new Error("Connection cancelled.");
    }
  };

  try {
    const token = await getCoveVoiceToken(
      controller.signal
    );

    ensureActive();

    const pc = new RTCPeerConnection();
    covePeerConnection = pc;

    /* RECEIVE COVE MINI'S VOICE */

    const audio = document.createElement("audio");

    audio.autoplay = true;
    audio.playsInline = true;
    audio.style.display = "none";

    document.body.appendChild(audio);
    coveAudio = audio;

    pc.ontrack = event => {
      audio.srcObject = event.streams[0];
      audio.play().catch(console.error);
    };

    /* ACTIVATE MICROPHONE */

    const mic =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    if (version !== sessionVersion) {
      mic.getTracks().forEach(
        track => track.stop()
      );

      throw new Error("Connection cancelled.");
    }

    coveMicrophoneStream = mic;

    pc.addTrack(
      mic.getAudioTracks()[0],
      mic
    );

    /* RECEIVE VOICE EVENTS */

    const channel =
      pc.createDataChannel("oai-events");

    channel.onmessage = event => {
      if (version !== sessionVersion) return;

      let data;

      try {
        data = JSON.parse(event.data);
      } catch (_) {
        return;
      }

      if (
        data.type === "output_audio_buffer.started"
      ) {
        setCoveMotion(true);
        status.textContent = "Cove Mini is speaking!";
      } else if (
        data.type === "output_audio_buffer.stopped"
      ) {
        setCoveMotion(false);
        status.textContent = "Listening...";
      }
    };

    /* CLEAN UP IF THE CONNECTION FAILS OR CLOSES */

    pc.onconnectionstatechange = () => {
      if (
        version === sessionVersion &&
        (
          pc.connectionState === "failed" ||
          pc.connectionState === "closed"
        )
      ) {
        stopCoveLiveVoice();
      }
    };

    /* ESTABLISH THE LIVE VOICE CONNECTION */

    const offer = await pc.createOffer();

    ensureActive();

    await pc.setLocalDescription(offer);

    ensureActive();

    const response = await fetch(
      "https://api.openai.com/v1/realtime/calls",
      {
        method: "POST",

        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/sdp"
        },

        body: offer.sdp,
        signal: controller.signal
      }
    );

    ensureActive();

    if (!response.ok) {
      throw new Error(
        "Realtime connection failed: " + response.status
      );
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: await response.text()
    });

    ensureActive();

    connectionAbort = null;

    showConnectionState(
      "connected",
      "Listening..."
    );

    console.log(
      "Cove Mini live voice connected!"
    );

  } catch (error) {
    // A cancelled attempt must not affect a newer session.
    if (version !== sessionVersion) return;

    console.error("Cove Mini error:", error);

    stopCoveLiveVoice();

    if (
      error.name !== "AbortError" &&
      error.message !== "Connection cancelled."
    ) {
      status.textContent = error.message;
    }
  }
}

/* ONE BUTTON STARTS, STOPS, OR CANCELS */

talkButton.addEventListener("click", () => {
  if (connectionState === "idle") {
    startCoveLiveVoice();
  } else {
    stopCoveLiveVoice();
  }
});
</script>
</body>
</html>
