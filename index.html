<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cove Mini 3.0</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(160deg, #e6f5ff, #a9d6f3);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  padding: 20px;
  width: 100%;
}

h1 {
  color: #244b68;
  margin-bottom: 65px;
}

.robot {
  position: relative;
  width: 240px;
  height: 310px;
  margin: auto;
}

.head-group {
  position: absolute;
  top: 28px;
  left: 20px;
  width: 200px;
  height: 175px;
  transform-origin: center bottom;
  animation: bob 2.6s ease-in-out infinite;
  z-index: 2;
}

.head {
  position: absolute;
  top: 30px;
  width: 200px;
  height: 145px;
  background: white;
  border-radius: 48%;
  box-shadow: 0 10px 25px #567a9950;
  z-index: 2;
}

.antenna {
  position: absolute;
  width: 15px;
  height: 65px;
  background: white;
  border-radius: 15px;
  top: -20px;
  z-index: 1;
  transform-origin: center bottom;
}

.antenna.left {
  left: 35px;
  animation: wiggleLeft 2.1s ease-in-out infinite;
}

.antenna.right {
  right: 35px;
  animation: wiggleRight 2.7s ease-in-out infinite;
}

.antenna::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -5px;
  width: 25px;
  height: 25px;
  background: white;
  border-radius: 50%;
}

@keyframes wiggleLeft {
  0%, 100% { transform: rotate(-25deg); }
  25% { transform: rotate(-38deg); }
  50% { transform: rotate(-18deg); }
  75% { transform: rotate(-32deg); }
}

@keyframes wiggleRight {
  0%, 100% { transform: rotate(25deg); }
  25% { transform: rotate(15deg); }
  50% { transform: rotate(39deg); }
  75% { transform: rotate(20deg); }
}

.eye {
  position: absolute;
  background: #111;
  border-radius: 50%;
  top: 48px;
}

.eye.left {
  width: 48px;
  height: 55px;
  left: 38px;
}

.eye.right {
  width: 35px;
  height: 42px;
  right: 42px;
  top: 55px;
}

.body {
  position: absolute;
  width: 155px;
  height: 135px;
  left: 42px;
  top: 165px;
  background: #fdfdfd;
  border-radius: 45% 45% 35% 35%;
  box-shadow: 0 12px 25px #567a9950;
}

@keyframes bob {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }
  50% {
    transform: translateY(-14px) rotate(6deg);
  }
}

button {
  margin-top: 15px;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  background: #245d86;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #163e5b;
}

#status {
  color: #244b68;
  min-height: 25px;
}

#webResults {
  max-width: 540px;
  margin: 24px auto 0;
  padding: 18px;
  border-radius: 20px;
  background: #ffffffd9;
  color: #244b68;
  text-align: left;
  overflow-wrap: anywhere;
}

#webResults h2 {
  font-size: 17px;
  margin: 0 0 10px;
}

#searchQuery,
#searchNote {
  font-size: 14px;
  line-height: 1.5;
}

#sourceList {
  margin: 8px 0;
  padding-left: 22px;
}

#sourceList li {
  margin: 10px 0;
  line-height: 1.5;
}

#sourceList a {
  color: #164f7a;
  text-decoration: underline;
}
</style>
</head>

<body>
<div class="container">
  <h1>Meet Cove Mini!</h1>

  <div class="robot" id="robot">
    <div class="head-group">
      <div class="antenna left"></div>
      <div class="antenna right"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
    </div>

    <div class="body"></div>
  </div>

  <button id="talkButton" type="button">
    Talk to Cove Mini
  </button>

  <p id="status" role="status" aria-live="polite">
    Ready to say hello!
  </p>

  <section
    id="webResults"
    aria-label="Web search sources"
    hidden
  >
    <h2>Sources from the latest search</h2>
    <p id="searchQuery"></p>
    <ul id="sourceList"></ul>
    <p id="searchNote"></p>
  </section>
</div>

<script>
/* CONNECTION SETTINGS */

const robot = document.getElementById("robot");
const status = document.getElementById("status");
const talkButton = document.getElementById("talkButton");
const webResults = document.getElementById("webResults");
const searchQuery = document.getElementById("searchQuery");
const sourceList = document.getElementById("sourceList");
const searchNote = document.getElementById("searchNote");

const COVE_WORKER_BASE =
  "https://cove-mini-voice.ycrt22frsb.workers.dev";

const COVE_WORKER_URL =
  COVE_WORKER_BASE + "/session?web_search=1";

const COVE_SEARCH_URL =
  COVE_WORKER_BASE + "/search";

const ACCESS_TOKEN_STORAGE_KEY =
  "coveMiniWorkerAccessToken";

/* SMOOTH HEAD AND ANTENNA MOVEMENTS */

const motionParts = [
  {
    element: document.querySelector(".head-group"),
    name: "bob",
    talkRate: 2.6 / 1.0
  },
  {
    element: document.querySelector(".antenna.left"),
    name: "wiggleLeft",
    talkRate: 2.1 / 0.45
  },
  {
    element: document.querySelector(".antenna.right"),
    name: "wiggleRight",
    talkRate: 2.7 / 0.6
  }
];

const speedFrames = new WeakMap();

function setCoveMotion(talking) {
  robot.classList.toggle("talking", talking);

  for (const part of motionParts) {
    const animation = part.element.getAnimations().find(
      item => item.animationName === part.name
    );

    if (!animation) continue;

    const oldFrame = speedFrames.get(animation);

    if (oldFrame !== undefined) {
      cancelAnimationFrame(oldFrame);
    }

    const initial = animation.playbackRate;
    const target = talking ? part.talkRate : 1;

    if (Math.abs(initial - target) < 0.001) {
      speedFrames.delete(animation);
      continue;
    }

    let start = null;

    function tick(now) {
      if (start === null) start = now;

      const fraction = Math.min(
        (now - start) / 450,
        1
      );

      const smooth =
        fraction * fraction * (3 - 2 * fraction);

      animation.playbackRate =
        initial + (target - initial) * smooth;

      if (fraction < 1) {
        speedFrames.set(
          animation,
          requestAnimationFrame(tick)
        );
      } else {
        animation.playbackRate = target;
        speedFrames.delete(animation);
      }
    }

    speedFrames.set(
      animation,
      requestAnimationFrame(tick)
    );
  }
}

/* SESSION STATE */

let liveSession = null;
let sessionVersion = 0;
let connectionState = "idle";

function isCurrent(session) {
  return (
    liveSession === session &&
    session.version === sessionVersion
  );
}

function showConnectionState(state, message) {
  connectionState = state;

  talkButton.textContent =
    state === "connected"
      ? "Stop talking"
      : state === "connecting"
        ? "Cancel connection"
        : "Talk to Cove Mini";

  status.textContent = message;
}

function updateLiveStatus(session) {
  if (
    !isCurrent(session) ||
    connectionState !== "connected"
  ) {
    return;
  }

  status.textContent =
    session.userSpeaking
      ? "Listening..."
      : session.speaking
        ? "Cove Mini is speaking!"
        : session.searches.size
          ? "Checking the web..."
          : session.activeResponses.size ||
            session.followupRequested
            ? "Cove Mini is thinking..."
            : "Listening...";
}

/* REMEMBER THE COVE MINI ACCESS TOKEN */

function readSavedAccessToken() {
  try {
    return localStorage.getItem(
      ACCESS_TOKEN_STORAGE_KEY
    );
  } catch (_) {
    return null;
  }
}

function saveAccessToken(token) {
  try {
    localStorage.setItem(
      ACCESS_TOKEN_STORAGE_KEY,
      token
    );
  } catch (_) {
    // This connection can still use its token in memory.
  }
}

function clearAccessToken() {
  try {
    localStorage.removeItem(
      ACCESS_TOKEN_STORAGE_KEY
    );
  } catch (_) {
    // Storage may be unavailable.
  }
}

async function getCoveVoiceToken(signal) {
  let accessToken = readSavedAccessToken();

  if (!accessToken) {
    accessToken = prompt(
      "Enter your private Cove Mini access token:"
    );
  }

  if (!accessToken || !accessToken.trim()) {
    throw new Error("Connection cancelled.");
  }

  accessToken = accessToken.trim();

  const response = await fetch(COVE_WORKER_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + accessToken
    },
    body: JSON.stringify({}),
    signal
  });

  if (
    response.status === 401 ||
    response.status === 403
  ) {
    clearAccessToken();

    throw new Error(
      "Access token rejected. Press Talk to enter it again."
    );
  }

  if (!response.ok) {
    throw new Error(
      "Voice connection failed: " + response.status
    );
  }

  const data = await response.json();

  if (signal.aborted) {
    throw new Error("Connection cancelled.");
  }

  const temporaryToken =
    data.value || data.client_secret?.value;

  if (!temporaryToken) {
    throw new Error("Voice credential missing.");
  }

  if (
    Array.isArray(data.session?.tools) &&
    !data.session.tools.some(
      tool => tool.name === "search_web"
    )
  ) {
    throw new Error(
      "Deploy the updated Cloudflare Worker, then try again."
    );
  }

  saveAccessToken(accessToken);

  return {
    temporaryToken,
    accessToken
  };
}

/* CLICKABLE SOURCES: NEVER INSERT WEB CONTENT AS HTML */

function showSearchSources(
  query,
  result,
  errorMessage = ""
) {
  searchQuery.textContent = query;
  sourceList.replaceChildren();

  const seen = new Set();

  for (const source of result?.sources || []) {
    let url;

    try {
      url = new URL(source.url);
    } catch (_) {
      continue;
    }

    if (
      !["https:", "http:"].includes(url.protocol) ||
      seen.has(url.href)
    ) {
      continue;
    }

    seen.add(url.href);

    const li = document.createElement("li");
    const link = document.createElement("a");

    link.href = url.href;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = source.title || url.hostname;

    li.appendChild(link);
    sourceList.appendChild(li);
  }

  searchNote.textContent =
    errorMessage ||
    (
      seen.size
        ? "Open a source to check the details."
        : "No source links were returned for this lookup."
    );

  webResults.hidden = false;
}

/* SEND RESULTS TO THE LIVE VOICE SESSION */

function sendEvent(session, event) {
  if (
    !isCurrent(session) ||
    session.channel?.readyState !== "open"
  ) {
    return false;
  }

  try {
    session.channel.send(JSON.stringify(event));
    return true;
  } catch (_) {
    failSession(
      session,
      "Voice connection lost. Press Talk to reconnect."
    );

    return false;
  }
}

function sendToolOutput(session, callId, output) {
  if (session.returnedCalls.has(callId)) return;

  const sent = sendEvent(session, {
    type: "conversation.item.create",
    item: {
      type: "function_call_output",
      call_id: callId,
      output: JSON.stringify(output)
    }
  });

  if (sent) {
    session.returnedCalls.add(callId);
  }
}

function cancelSearches(session, notifyVoice) {
  session.followupTurn = null;

  for (
    const [callId, controller] of session.searches
  ) {
    controller.abort();

    if (notifyVoice) {
      sendToolOutput(session, callId, {
        error:
          "Search cancelled because the user started speaking again."
      });
    }
  }

  session.searches.clear();
}

function requestSearchReply(session) {
  if (
    !isCurrent(session) ||
    session.followupTurn !== session.turn ||
    session.userSpeaking ||
    session.activeResponses.size ||
    session.searches.size ||
    session.followupRequested
  ) {
    return;
  }

  session.followupTurn = null;
  session.followupRequested = true;

  sendEvent(session, {
    type: "response.create",
    response: {
      output_modalities: ["audio"],
      tool_choice: "none",
      metadata: {
        cove_search_turn: String(session.turn)
      }
    }
  });

  updateLiveStatus(session);
}

async function runSearch(session, call, turn) {
  const controller = new AbortController();

  session.searches.set(
    call.call_id,
    controller
  );

  const timeout = setTimeout(
    () => controller.abort(),
    55000
  );

  let query = "Web search";

  updateLiveStatus(session);

  try {
    if (call.name !== "search_web") {
      throw new Error("Unknown search tool.");
    }

    const args = JSON.parse(call.arguments);

    query =
      typeof args?.query === "string"
        ? args.query.trim()
        : "";

    if (!query || query.length > 1000) {
      throw new Error(
        "The search query was invalid. Please try again."
      );
    }

    const response = await fetch(
      COVE_SEARCH_URL,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization:
            "Bearer " + session.accessToken
        },
        body: JSON.stringify({ query }),
        signal: controller.signal
      }
    );

    if (
      !isCurrent(session) ||
      turn !== session.turn
    ) {
      return;
    }

    const result = await response.json();

    if (
      !isCurrent(session) ||
      turn !== session.turn
    ) {
      return;
    }

    if (!response.ok) {
      if (
        response.status === 401 ||
        response.status === 403
      ) {
        clearAccessToken();
      }

      throw new Error(
        result.error ||
        "Web search failed. Please try again."
      );
    }

    if (
      typeof result.answer !== "string" ||
      !result.answer.trim()
    ) {
      throw new Error(
        "The search returned no answer. Please try again."
      );
    }

    showSearchSources(query, result);

    sendToolOutput(session, call.call_id, {
      answer: result.answer,
      sources: result.sources || [],
      retrieved_at: result.retrieved_at
    });
  } catch (error) {
    if (
      !isCurrent(session) ||
      turn !== session.turn
    ) {
      return;
    }

    const message =
      error.name === "AbortError"
        ? "The web search timed out. Please try again."
        : error.message ||
          "Web search is unavailable right now.";

    showSearchSources(
      query,
      null,
      message
    );

    sendToolOutput(session, call.call_id, {
      error: message
    });
  } finally {
    clearTimeout(timeout);

    session.searches.delete(
      call.call_id
    );

    updateLiveStatus(session);
  }
}

async function handleFunctionCalls(
  session,
  response,
  turn
) {
  const calls = (response.output || []).filter(
    item =>
      item.type === "function_call" &&
      item.call_id &&
      !session.seenCalls.has(item.call_id)
  );

  for (const call of calls) {
    session.seenCalls.add(call.call_id);
  }

  if (!calls.length) return;

  if (
    response.status !== "completed" ||
    turn !== session.turn ||
    session.userSpeaking
  ) {
    for (const call of calls) {
      sendToolOutput(session, call.call_id, {
        error:
          "This request was interrupted. No search was started."
      });
    }

    return;
  }

  await Promise.all(
    calls.map(
      call => runSearch(session, call, turn)
    )
  );

  if (
    !isCurrent(session) ||
    turn !== session.turn
  ) {
    return;
  }

  if (
    calls.every(
      call =>
        session.returnedCalls.has(call.call_id)
    )
  ) {
    session.followupTurn = turn;
    requestSearchReply(session);
  }
}

/* VOICE EVENTS AND USER INTERRUPTIONS */

function handleVoiceEvent(session, event) {
  if (!isCurrent(session)) return;

  let data;

  try {
    data = JSON.parse(event.data);
  } catch (_) {
    return;
  }

  switch (data.type) {
    case "input_audio_buffer.speech_started":
      session.turn++;
      session.userSpeaking = true;
      cancelSearches(session, true);
      break;

    case "input_audio_buffer.speech_stopped":
      session.userSpeaking = false;
      break;

    case "response.created": {
      const response = data.response;

      const taggedTurn =
        response.metadata?.cove_search_turn;

      const turn =
        taggedTurn === undefined
          ? session.turn
          : Number(taggedTurn);

      session.followupRequested = false;

      session.activeResponses.add(
        response.id
      );

      session.responseTurns.set(
        response.id,
        turn
      );

      if (turn !== session.turn) {
        sendEvent(session, {
          type: "response.cancel",
          response_id: response.id
        });
      }

      break;
    }

    case "response.done": {
      const response = data.response;

      if (
        !response ||
        session.finishedResponses.has(response.id)
      ) {
        return;
      }

      session.finishedResponses.add(
        response.id
      );

      session.activeResponses.delete(
        response.id
      );

      const turn =
        session.responseTurns.get(response.id) ??
        session.turn;

      session.responseTurns.delete(
        response.id
      );

      void handleFunctionCalls(
        session,
        response,
        turn
      );

      requestSearchReply(session);
      break;
    }

    case "output_audio_buffer.started":
      session.speaking = true;
      setCoveMotion(true);
      break;

    case "output_audio_buffer.stopped":
    case "output_audio_buffer.cleared":
      session.speaking = false;
      setCoveMotion(false);
      break;

    case "error":
      session.followupRequested = false;

      status.textContent =
        "Cove Mini hit a voice error. Please try again.";

      return;
  }

  updateLiveStatus(session);
}

/* STOP, CANCEL, AND CLEAN UP */

function stopCoveLiveVoice() {
  const session = liveSession;

  liveSession = null;
  ++sessionVersion;

  if (session) {
    clearTimeout(session.connectTimer);
    session.abort.abort();

    cancelSearches(session, false);

    session.microphone?.getTracks().forEach(
      track => track.stop()
    );

    session.channel?.close();
    session.pc?.close();

    if (session.audio) {
      session.audio.pause();
      session.audio.srcObject = null;
      session.audio.remove();
    }

    session.accessToken = "";
  }

  setCoveMotion(false);

  showConnectionState(
    "idle",
    "Ready to say hello!"
  );
}

function failSession(session, message) {
  if (!isCurrent(session)) return;

  stopCoveLiveVoice();
  status.textContent = message;
}

function markConnected(session) {
  if (
    !isCurrent(session) ||
    session.pc?.connectionState !== "connected" ||
    session.channel?.readyState !== "open"
  ) {
    return;
  }

  clearTimeout(session.connectTimer);

  showConnectionState(
    "connected",
    "Listening..."
  );

  updateLiveStatus(session);
}

/* START THE LIVE VOICE CONNECTION */

async function startCoveLiveVoice() {
  if (connectionState !== "idle") return;

  const session = {
    version: ++sessionVersion,
    abort: new AbortController(),
    accessToken: "",
    pc: null,
    channel: null,
    microphone: null,
    audio: null,
    connectTimer: null,
    turn: 0,
    userSpeaking: false,
    speaking: false,
    followupTurn: null,
    followupRequested: false,
    activeResponses: new Set(),
    responseTurns: new Map(),
    finishedResponses: new Set(),
    seenCalls: new Set(),
    returnedCalls: new Set(),
    searches: new Map()
  };

  liveSession = session;

  showConnectionState(
    "connecting",
    "Connecting Cove Mini..."
  );

  webResults.hidden = true;

  session.connectTimer = setTimeout(() => {
    failSession(
      session,
      "Connection timed out. Press Talk to try again."
    );
  }, 45000);

  const ensureActive = () => {
    if (!isCurrent(session)) {
      throw new Error("Connection cancelled.");
    }
  };

  try {
    const credentials = await getCoveVoiceToken(
      session.abort.signal
    );

    ensureActive();

    session.accessToken =
      credentials.accessToken;

    const pc = new RTCPeerConnection();
    session.pc = pc;

    const audio =
      document.createElement("audio");

    audio.autoplay = true;
    audio.playsInline = true;
    audio.style.display = "none";

    document.body.appendChild(audio);
    session.audio = audio;

    pc.ontrack = event => {
      if (!isCurrent(session)) return;

      audio.srcObject = event.streams[0];

      audio.play().catch(() => {
        if (isCurrent(session)) {
          status.textContent =
            "Audio could not start. Stop and reconnect.";
        }
      });
    };

    const mic =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    if (!isCurrent(session)) {
      mic.getTracks().forEach(
        track => track.stop()
      );

      throw new Error("Connection cancelled.");
    }

    session.microphone = mic;

    pc.addTrack(
      mic.getAudioTracks()[0],
      mic
    );

    const channel =
      pc.createDataChannel("oai-events");

    session.channel = channel;

    channel.onopen = () =>
      markConnected(session);

    channel.onmessage = event =>
      handleVoiceEvent(session, event);

    channel.onclose = () =>
      failSession(
        session,
        "Voice connection closed. Press Talk to reconnect."
      );

    pc.onconnectionstatechange = () => {
      if (!isCurrent(session)) return;

      if (
        pc.connectionState === "failed" ||
        pc.connectionState === "closed"
      ) {
        failSession(
          session,
          "Voice connection ended. Press Talk to reconnect."
        );
      } else {
        markConnected(session);
      }
    };

    const offer = await pc.createOffer();

    ensureActive();

    await pc.setLocalDescription(offer);

    ensureActive();

    const response = await fetch(
      "https://api.openai.com/v1/realtime/calls",
      {
        method: "POST",
        headers: {
          Authorization:
            "Bearer " + credentials.temporaryToken,
          "Content-Type": "application/sdp"
        },
        body: offer.sdp,
        signal: session.abort.signal
      }
    );

    ensureActive();

    if (!response.ok) {
      throw new Error(
        "Realtime connection failed: " +
        response.status
      );
    }

    const sdp = await response.text();

    ensureActive();

    await pc.setRemoteDescription({
      type: "answer",
      sdp
    });

    ensureActive();
    markConnected(session);
  } catch (error) {
    if (!isCurrent(session)) return;

    stopCoveLiveVoice();

    if (
      error.name !== "AbortError" &&
      error.message !== "Connection cancelled."
    ) {
      status.textContent = error.message;
    }
  }
}

/* ONE BUTTON STARTS, STOPS, OR CANCELS */

talkButton.addEventListener("click", () => {
  if (connectionState === "idle") {
    startCoveLiveVoice();
  } else {
    stopCoveLiveVoice();
  }
});

window.addEventListener(
  "pagehide",
  stopCoveLiveVoice
);
</script>
