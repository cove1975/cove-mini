<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cove Mini 2.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(
    160deg,
    #e6f5ff,
    #a9d6f3
  );
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  padding: 20px;
}

h1 {
  color: #244b68;
  margin-bottom: 65px;
}

.robot {
  position: relative;
  width: 240px;
  height: 310px;
  margin: auto;
}

/* MOVING HEAD */

.head-group {
  position: absolute;
  top: 28px;
  left: 20px;
  width: 200px;
  height: 175px;
  transform-origin: center bottom;
  animation: bob 2.6s ease-in-out infinite;
  z-index: 2;
}

.head {
  position: absolute;
  top: 30px;
  width: 200px;
  height: 145px;
  background: white;
  border-radius: 48%;
  box-shadow: 0 10px 25px #567a9950;
  z-index: 2;
}

/* INDEPENDENT ANTENNAS */

.antenna {
  position: absolute;
  width: 15px;
  height: 65px;
  background: white;
  border-radius: 15px;
  top: -20px;
  z-index: 1;
  transform-origin: center bottom;
}

.antenna.left {
  left: 35px;
  animation: wiggleLeft 2.1s ease-in-out infinite;
}

.antenna.right {
  right: 35px;
  animation: wiggleRight 2.7s ease-in-out infinite;
}

.antenna::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -5px;
  width: 25px;
  height: 25px;
  background: white;
  border-radius: 50%;
}

/* ANTENNA ANIMATIONS */

@keyframes wiggleLeft {
  0%, 100% {
    transform: rotate(-25deg);
  }
  25% {
    transform: rotate(-38deg);
  }
  50% {
    transform: rotate(-18deg);
  }
  75% {
    transform: rotate(-32deg);
  }
}

@keyframes wiggleRight {
  0%, 100% {
    transform: rotate(25deg);
  }
  25% {
    transform: rotate(15deg);
  }
  50% {
    transform: rotate(39deg);
  }
  75% {
    transform: rotate(20deg);
  }
}

/* EXPRESSIVE EYES */

.eye {
  position: absolute;
  background: #111;
  border-radius: 50%;
  top: 48px;
}

.eye.left {
  width: 48px;
  height: 55px;
  left: 38px;
}

.eye.right {
  width: 35px;
  height: 42px;
  right: 42px;
  top: 55px;
}

/* BODY */

.body {
  position: absolute;
  width: 155px;
  height: 135px;
  left: 42px;
  top: 165px;
  background: #fdfdfd;
  border-radius: 45% 45% 35% 35%;
  box-shadow: 0 12px 25px #567a9950;
}

/* HEAD BOBBING */

@keyframes bob {
  0%, 100% {
    transform: translateY(0) rotate(-5deg);
  }
  50% {
    transform: translateY(-14px) rotate(6deg);
  }
}

/* SPEAKING ANIMATIONS */

.robot.talking .head-group {
  animation: bob 0.55s ease-in-out infinite;
}

.robot.talking .antenna.left {
  animation: wiggleLeft 0.45s ease-in-out infinite;
}

.robot.talking .antenna.right {
  animation: wiggleRight 0.6s ease-in-out infinite;
}

/* BUTTON */

button {
  margin-top: 15px;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  background: #245d86;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #163e5b;
}

#status {
  color: #244b68;
  min-height: 25px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Meet Cove Mini!</h1>

  <div class="robot" id="robot">

    <div class="head-group">

      <div class="antenna left"></div>
      <div class="antenna right"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>

    </div>

    <div class="body"></div>

  </div>

  <button onclick="speak()">
    Talk to Cove Mini
  </button>

  <p id="status">
    Ready to say hello!
  </p>

</div>

<script>

function speak() {

  const robot =
    document.getElementById("robot");

  const status =
    document.getElementById("status");

  if (!("speechSynthesis" in window)) {
    status.textContent =
      "Speech is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();

  const message =
    new SpeechSynthesisUtterance(
      "Hello! I'm Cove Mini! " +
      "Look at my new antennas! " +
      "Now I can wiggle them independently! " +
      "What do you think?"
    );

  message.lang = "en-US";
  message.rate = 0.95;
  message.pitch = 1.15;

  message.onstart = function() {
    robot.classList.add("talking");
    status.textContent =
      "Cove Mini is speaking!";
  };

  function finish() {
    robot.classList.remove("talking");
    status.textContent =
      "Ready to say hello!";
  }

  message.onend = finish;
  message.onerror = finish;

  window.speechSynthesis.speak(message);
}

</script>

</body>
</html>
